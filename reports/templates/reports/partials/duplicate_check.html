{% if similar_reports %}
<div class="alert alert-warning text-xs mt-2 p-3 bg-amber-50 border border-amber-200 text-amber-800 rounded-xl space-y-1">
    <p class="font-bold flex items-center gap-1">
        ⚠️ Potential Duplicate Issues Found:
    </p>
    <ul class="list-disc pl-4 space-y-1">
        {% for report in similar_reports %}
        <li>
            <a href="{% url 'projects:reports:report_detail' project_uuid=report.project.uuid report_uuid=report.uuid %}" target="_blank" class="underline font-semibold hover:text-amber-900">
                {{ report.title }}
            </a>
            <span class="text-gray-500">(#{{ report.id }} - {{ report.get_status_display }})</span>
        </li>
        {% endfor %}
    </ul>
</div>
{% endif %}
