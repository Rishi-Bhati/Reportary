<div class="grid grid-cols-2 gap-4 text-xs">
    <!-- Reassign -->
    <form method="post" action="{% url 'projects:reports:reassign_report' project_uuid=project.uuid report_uuid=report.uuid %}" class="space-y-1">
        {% csrf_token %}
        <label class="font-semibold text-gray-400 uppercase tracking-wider block text-xs" for="id_assignee">Assignee</label>
        <select name="assignee" id="id_assignee" onchange="this.form.submit()" class="select select-bordered select-sm w-full rounded-lg bg-white border-gray-200 focus:border-[#226ce0] focus:outline-none">
            <option disabled {% if not report.assigned_to %}selected{% endif %}>Unassigned</option>
            {% for user in collaborators %}
            <option value="{{ user.uuid }}" {% if report.assigned_to.uuid == user.uuid %}selected{% endif %}>
                @{{ user.username }}
            </option>
            {% endfor %}
        </select>
    </form>

    <!-- Status -->
    <form method="post" action="{% url 'projects:reports:change_report_status' project_uuid=project.uuid report_uuid=report.uuid %}" class="space-y-1">
        {% csrf_token %}
        <label class="font-semibold text-gray-400 uppercase tracking-wider block text-xs" for="id_status">Status</label>
        <select name="status" id="id_status" onchange="this.form.submit()" class="select select-bordered select-sm w-full rounded-lg bg-white border-gray-200 focus:border-[#226ce0] focus:outline-none">
            {% for value, display in status_choices %}
            <option value="{{ value }}" {% if report.status == value %}selected{% endif %}>
                {{ display }}
            </option>
            {% endfor %}
        </select>
    </form>

    <!-- Visibility -->
    <form method="post" action="{% url 'projects:reports:change_report_visibility' project_uuid=project.uuid report_uuid=report.uuid %}" class="space-y-1">
        {% csrf_token %}
        <label class="font-semibold text-gray-400 uppercase tracking-wider block text-xs" for="id_visibility">Visibility</label>
        <select name="visibility" id="id_visibility" onchange="this.form.submit()" class="select select-bordered select-sm w-full rounded-lg bg-white border-gray-200 focus:border-[#226ce0] focus:outline-none">
            <option value="true" {% if report.visibility %}selected{% endif %}>Visible</option>
            <option value="false" {% if not report.visibility %}selected{% endif %}>Hidden</option>
        </select>
    </form>

    <!-- Impact -->
    <form method="post" action="{% url 'projects:reports:change_report_impact' project_uuid=project.uuid report_uuid=report.uuid %}" class="space-y-1">
        {% csrf_token %}
        <label class="font-semibold text-gray-400 uppercase tracking-wider block text-xs" for="id_impact">Impact</label>
        <select name="impact" id="id_impact" onchange="this.form.submit()" class="select select-bordered select-sm w-full rounded-lg bg-white border-gray-200 focus:border-[#226ce0] focus:outline-none">
            {% for value, display in impact_choices %}
            <option value="{{ value }}" {% if report.impact == value %}selected{% endif %}>
                {{ display }}
            </option>
            {% endfor %}
        </select>
    </form>
</div>
