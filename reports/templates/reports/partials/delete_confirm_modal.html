<div class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full border border-gray-100 shadow-2xl p-6 space-y-6 animate-fade-in-up">
        <div class="flex items-start gap-4">
            <div class="p-3 bg-red-50 text-red-600 rounded-2xl shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
            </div>
            <div class="space-y-1 min-w-0">
                <h3 class="font-bold text-gray-900 text-lg">Delete Report?</h3>
                <p class="text-sm text-gray-500 leading-relaxed">
                    Are you sure you want to delete <strong>"{{ report.title }}"</strong>? This action is permanent and cannot be undone.
                </p>
            </div>
        </div>
        
        <div class="flex items-center gap-3 pt-2">
            <button onclick="document.getElementById('delete-modal-container').innerHTML=''" class="flex-1 btn btn-outline border-gray-300 hover:bg-gray-100 text-gray-700 rounded-xl font-semibold capitalize">
                Cancel
            </button>
            <form action="{% url 'projects:reports:delete_report' project_uuid=project.uuid report_uuid=report.uuid %}" method="post" class="flex-1">
                {% csrf_token %}
                <button type="submit" class="w-full btn bg-red-600 hover:bg-red-700 text-white border-none rounded-xl font-semibold capitalize shadow-md shadow-red-600/10">
                    Delete
                </button>
            </form>
        </div>
    </div>
</div>
