{% load static %}
<header
    class="navbar bg-white/95 backdrop-blur-md border-b border-[#d0bcd5]/30 h-16 fixed top-0 left-0 right-0 z-50 px-4 md:px-6 shadow-sm">
    <!-- Left: Mobile Menu Toggle & Logo -->
    <div class="flex-1 flex items-center gap-2 md:gap-4">
        <button onclick="toggleMobileSidebar()" class="btn btn-ghost btn-circle btn-sm text-[#534b62] hover:bg-[#226ce0]/10 md:hidden" title="Toggle Sidebar">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <a href="{% url 'dashboard:dashboard' %}" class="flex items-center gap-2.5 hover:opacity-90 transition">
            <div
                class="w-9 h-9 rounded-xi bg-gradient-to-br from-[#226ce0] to-[#1b56b3] text-white flex items-center justify-center font-bold text-lg shadow-md">
                R
            </div>
            <span class="text-xl font-bold tracking-tight text-[#1b1725] hidden sm:inline">Reportary</span>
        </a>
    </div>

    <!-- Right: Navigation & Actions -->
    <div class="flex-none flex items-center gap-2 md:gap-4">
        <!-- Global Search (Desktop) -->
        <div class="relative hidden md:block" id="topbar-search-container">
            <form action="{% url 'global_search' %}" method="get" class="relative" id="topbar-search-form">
                <input type="text" name="q" id="topbar-search-input" autocomplete="off"
                    value="{{ request.GET.q|default:'' }}" placeholder="Search..."
                    hx-get="{% url 'global_search_glimpse' %}"
                    hx-trigger="keyup changed delay:200ms, focus"
                    hx-target="#search-glimpse-bubble"
                    class="input input-sm h-9 w-64 bg-[#f8f6fa] border-transparent focus:bg-white focus:border-[#226ce0] transition-all rounded-xl pl-9 text-sm placeholder:text-gray-400" />
                <svg class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </form>
            
            <!-- Popdown Glimpse Bubble Dropdown Menu -->
            <div id="search-glimpse-bubble" class="absolute right-0 top-full mt-2 w-96 bg-white border border-[#d0bcd5]/30 rounded-2xl shadow-xl z-50 hidden overflow-y-auto max-h-96">
                <!-- Content is dynamically swapped by HTMX -->
            </div>
        </div>

        <script>
            (function initSearchGlimpse() {
                const searchInput = document.getElementById('topbar-search-input');
                const bubble = document.getElementById('search-glimpse-bubble');
                const container = document.getElementById('topbar-search-container');

                if (searchInput && bubble) {
                    searchInput.addEventListener('focus', () => {
                        bubble.classList.remove('hidden');
                    });

                    document.addEventListener('click', (e) => {
                        if (container && !container.contains(e.target)) {
                            bubble.classList.add('hidden');
                        }
                    });
                } else {
                    document.addEventListener('DOMContentLoaded', initSearchGlimpse);
                }
            })();

            function selectGlimpseQuery(query) {
                const searchInput = document.getElementById('topbar-search-input');
                const searchForm = document.getElementById('topbar-search-form');
                if (searchInput && searchForm) {
                    searchInput.value = query;
                    searchForm.submit();
                }
            }
        </script>

        <!-- Nav Links -->
        <nav class="hidden lg:flex items-center gap-1">
            <a href="{% url 'projects:projects_view' %}"
                class="px-3 py-2 text-sm font-medium text-[#534b62] hover:text-[#226ce0] hover:bg-[#226ce0]/10 rounded-lg transition-all">Explore</a>
            <a href="{% url 'home:faq' %}"
                class="px-3 py-2 text-sm font-medium text-[#534b62] hover:text-[#226ce0] hover:bg-[#226ce0]/10 rounded-lg transition-all">Help</a>
        </nav>

        <!-- Theme Toggle Button -->
        <button id="theme-toggle-btn" onclick="toggleTheme()" class="btn btn-ghost btn-circle btn-sm hover:bg-[#226ce0]/10 text-[#534b62] hover:text-[#226ce0] transition-colors" title="Toggle Light/Dark Mode">
            <!-- Sun icon -->
            <svg id="theme-sun-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"></path>
            </svg>
            <!-- Moon icon -->
            <svg id="theme-moon-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
        </button>

        <!-- Notifications -->
         <a href="{% url 'notifications:center' %}">

        <button 
            class="btn btn-ghost btn-circle btn-sm relative hover:bg-[#226ce0]/10 text-[#534b62] hover:text-[#226ce0] transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9">
                </path>
            </svg>
            {% if unread_notification_count > 0 %}
            <span class="absolute -top-1 -right-1 min-w-5 h-5 px-1 bg-[#ef4444] text-white text-[10px] font-bold rounded-full border-2 border-white flex items-center justify-center shadow-sm">
                {{ unread_notification_count }}
            </span>
            {% endif %}
        </button>
        </a>

        <script>
            function updateThemeToggleIcons() {
                const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
                const sunIcon = document.getElementById('theme-sun-icon');
                const moonIcon = document.getElementById('theme-moon-icon');
                if (currentTheme === 'dark') {
                    if (sunIcon) sunIcon.classList.remove('hidden');
                    if (moonIcon) moonIcon.classList.add('hidden');
                } else {
                    if (sunIcon) sunIcon.classList.add('hidden');
                    if (moonIcon) moonIcon.classList.remove('hidden');
                }
            }

            function toggleTheme() {
                const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                document.documentElement.style.colorScheme = newTheme;
                localStorage.setItem('theme', newTheme);
                updateThemeToggleIcons();
            }

            (function initThemeToggle() {
                updateThemeToggleIcons();
                document.addEventListener('DOMContentLoaded', updateThemeToggleIcons);
                document.addEventListener('htmx:afterSwap', updateThemeToggleIcons);
            })();
        </script>
        <!-- Profile Dropdown -->
        <div class="dropdown dropdown-end">
            <label tabindex="0" class="btn btn-ghost btn-circle avatar hover:bg-[#226ce0]/10">
                <div
                    class="w-8 h-8 rounded-full bg-gradient-to-br from-[#226ce0] to-[#1b56b3] flex items-center justify-center text-white font-bold text-sm shadow-sm">
                    {{ user.username|slice:":1"|upper }}
                </div>
            </label>
            <ul tabindex="0"
                class="mt-3 z-[1] p-2 shadow-lg menu menu-sm dropdown-content bg-white rounded-xl w-52 border border-[#d0bcd5]/30">
                <li><a href="{% url 'home:profile' %}"
                        class="text-[#1b1725] hover:bg-[#226ce0]/10 hover:text-[#226ce0]">Profile</a></li>
                <li><a href="{% url 'organisations:list' %}"
                        class="text-[#1b1725] hover:bg-[#226ce0]/10 hover:text-[#226ce0]">Organisations</a></li>
                <li><a href="{% url 'home:nota' %}"
                        class="text-[#1b1725] hover:bg-[#226ce0]/10 hover:text-[#226ce0]">Settings</a></li>
                <li class="border-t border-[#d0bcd5]/30 mt-2 pt-2">
                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit" class="w-full text-left text-[#ef4444] hover:bg-red-50 px-4 py-2 rounded-lg">Logout</button>
                    </form>
                </li> 
            </ul>
        </div>
    </div>
</header>
