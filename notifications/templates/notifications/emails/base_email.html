<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{ subject }}</title>
  <!--[if mso]>
  <noscript>
    <xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>
  </noscript>
  <![endif]-->
  <style>
    /* Reset */
    * { box-sizing: border-box; }
    body, table, td, p, a, li, blockquote { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }

    /* Mobile */
    @media only screen and (max-width: 600px) {
      .wrapper { width: 100% !important; padding: 16px !important; }
      .card { border-radius: 12px !important; }
      .header-td { padding: 24px 20px !important; }
      .body-td { padding: 28px 20px !important; }
      .footer-td { padding: 20px !important; }
      .cta-btn { display: block !important; width: 100% !important; text-align: center !important; padding: 14px 20px !important; }
      .info-table td { display: block !important; width: 100% !important; padding: 4px 0 !important; }
      .fallback-url { font-size: 11px !important; word-break: break-all !important; }
      h1 { font-size: 20px !important; }
      h2 { font-size: 17px !important; }
      p, li { font-size: 14px !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#f4f6f9; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

  <!-- Outer wrapper -->
  <table border="0" cellpadding="0" cellspacing="0" width="100%"
         style="background-color:#f4f6f9;">
    <tr>
      <td align="center" style="padding:32px 16px;" class="wrapper">

        <!-- Card -->
        <table border="0" cellpadding="0" cellspacing="0" width="100%"
               style="max-width:580px; background-color:#ffffff; border-radius:16px; border:1px solid #e4e8ef; overflow:hidden;"
               class="card">

          <!-- Header -->
          <tr>
            <td align="center" style="background-color:#226ce0; padding:28px 32px;" class="header-td">
              <table border="0" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center">
                    <p style="margin:0; font-size:22px; font-weight:800; color:#ffffff; letter-spacing:-0.3px;">Reportary</p>
                    <p style="margin:4px 0 0 0; font-size:12px; color:rgba(255,255,255,0.75); font-weight:400;">Issue Tracking &amp; Collaboration</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:36px 32px 28px;" class="body-td">
              {% block email_content %}
              <h2 style="margin:0 0 12px 0; font-size:18px; font-weight:700; color:#1a1a2e;">{{ title }}</h2>
              <p style="margin:0; font-size:15px; line-height:1.65; color:#4a5568;">{{ message }}</p>
              {% endblock %}
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:0 32px;">
              <div style="height:1px; background-color:#edf2f7;"></div>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding:20px 32px;" class="footer-td">
              <p style="margin:0; font-size:12px; color:#a0aec0; line-height:1.6;">
                This is an automated email from Reportary. Please do not reply.
              </p>
              <p style="margin:6px 0 0 0; font-size:11px; color:#c4c9d4;">
                &copy; 2026 Reportary. All rights reserved.
              </p>
            </td>
          </tr>

        </table>
        <!-- /Card -->

      </td>
    </tr>
  </table>

</body>
</html>
