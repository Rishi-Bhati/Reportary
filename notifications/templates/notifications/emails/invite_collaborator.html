{% extends "notifications/emails/base_email.html" %}
{% block email_content %}

<h2 style="margin:0 0 12px 0; font-size:18px; font-weight:700; color:#1a1a2e;">Project collaboration invite</h2>

<p style="margin:0 0 20px 0; font-size:15px; line-height:1.65; color:#4a5568;">
  <strong>{{ actor_username }}</strong> has invited you to collaborate on <strong>{{ project_title }}</strong>.
</p>

<p style="margin:0; font-size:14px; line-height:1.65; color:#718096;">
  Log in to Reportary and check your Notification Center to accept or decline this invitation.
</p>

{% endblock %}
