{% extends "notifications/emails/base_email.html" %}
{% block email_content %}

<h2 style="margin:0 0 12px 0; font-size:18px; font-weight:700; color:#1a1a2e;">New comment on an issue</h2>

<p style="margin:0 0 16px 0; font-size:15px; line-height:1.65; color:#4a5568;">
  <strong>{{ actor_username }}</strong> commented:
</p>

<!-- Comment message -->
{% if message %}
<div style="margin:0 0 24px 0; background-color:#f7f9fc; border-left:3px solid #10b981; border-radius:6px; padding:14px 16px; font-size:14px; line-height:1.65; color:#4a5568; font-style:italic;">
  {{ message }}
</div>
{% endif %}

<!-- Issue details card -->
<table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom:20px; border-collapse:collapse;">
  <tr>
    <td style="padding:6px 0; font-size:13px; color:#a0aec0; width:90px; vertical-align:top;">Issue</td>
    <td style="padding:6px 0; font-size:13px; color:#2d3748; font-weight:600; vertical-align:top;">{{ report_title }}</td>
  </tr>
  <tr>
    <td style="padding:6px 0; font-size:13px; color:#a0aec0; vertical-align:top;">Project</td>
    <td style="padding:6px 0; font-size:13px; color:#2d3748; vertical-align:top;">{{ project_title }}</td>
  </tr>
</table>

{% if report_url %}
<div style="margin-top:28px; text-align:center;">
  <a href="{{ report_url }}" style="display:inline-block; padding:10px 20px; font-size:14px; font-weight:600; color:#ffffff; background-color:#226ce0; border-radius:6px; text-decoration:none;">
    View Comment
  </a>
</div>
{% endif %}

{% endblock %}
