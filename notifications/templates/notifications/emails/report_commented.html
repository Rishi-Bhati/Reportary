{% extends "notifications/emails/base_email.html" %}
{% block email_content %}
<h2 style="margin-top: 0; font-size: 20px; font-weight: 700; color: #1b1725;">{{ title }}</h2>
<p style="font-size: 16px; line-height: 1.6; color: #534b62;">
    A new comment was added by <strong>{{ actor_username }}</strong>:
</p>
<div style="background-color: #f8f6fa; border-left: 4px solid #10b981; padding: 16px; margin: 20px 0; border-radius: 4px;">
    <h3 style="margin: 0; font-size: 16px; color: #1b1725;">{{ report_title }}</h3>
    <p style="margin: 8px 0 0 0; font-size: 14px; color: #534b62;">Project: {{ project_title }}</p>
</div>
<p style="font-size: 16px; line-height: 1.6; color: #534b62;">{{ message }}</p>
{% endblock %}
