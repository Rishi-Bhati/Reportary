{% extends "notifications/emails/base_email.html" %}
{% block email_content %}

<h2 style="margin:0 0 12px 0; font-size:18px; font-weight:700; color:#1a1a2e;">New comment on an issue</h2>

<p style="margin:0 0 20px 0; font-size:15px; line-height:1.65; color:#4a5568;">
  <strong>{{ actor_username }}</strong> commented on the following issue.
</p>

<!-- Issue card -->
<table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom:20px;">
  <tr>
    <td style="background-color:#f7f9fc; border-left:3px solid #10b981; border-radius:6px; padding:14px 16px;">
      <p style="margin:0 0 4px 0; font-size:14px; font-weight:600; color:#1a1a2e;">{{ report_title }}</p>
      <p style="margin:0; font-size:12px; color:#718096;">{{ project_title }}</p>
    </td>
  </tr>
</table>

{% if message %}
<p style="margin:0; font-size:14px; line-height:1.65; color:#4a5568; font-style:italic;">"{{ message }}"</p>
{% endif %}

{% endblock %}
