{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Password Reset Complete" %} | Reportary{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="bg-white border border-gray-100 shadow-xl rounded-2xl overflow-hidden p-8 text-center space-y-6">
        <!-- Success Check Icon -->
        <div class="mx-auto w-16 h-16 bg-green-50 text-green-500 rounded-full flex items-center justify-center">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
        </div>

        <div class="space-y-2">
            <h2 class="text-2xl font-bold text-gray-900">Reset Complete</h2>
            <p class="text-gray-500 text-sm leading-relaxed">
                Your password has been set. You may now log in with your new password.
            </p>
        </div>

        <div class="pt-2">
            <a href="{% url 'home:landing_page' %}" class="w-full btn bg-[#226ce0] hover:bg-[#1b56b3] text-white font-semibold rounded-xl border-none shadow-md hover:shadow-lg transition-all capitalize">
                Log In Now
            </a>
        </div>
    </div>
</div>
{% endblock %}
