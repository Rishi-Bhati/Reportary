<div class="bg-yellow-50 border border-yellow-100 text-yellow-800 text-sm rounded-xl p-4 flex flex-col sm:flex-row justify-between items-center gap-3 w-full my-2">
    <span>{{ action_message }}</span>
    <form method="post" action="{% url 'accounts:resend_verification' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-xs bg-[#226ce0] hover:bg-[#1b56b3] text-white border-none rounded-lg px-3 py-1 text-xs">
            Resend verification email
        </button>
    </form>
</div>
