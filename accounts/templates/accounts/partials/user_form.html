<div class="card-body animate-fade-in text-gray-900">
    <div class="text-center mb-6">
        <h2 class="text-2xl font-bold">Before We begin...</h2>
        <p class="text-gray-500">We need Some more Info</p>
    </div>

    {% if error %}
    <div class="alert alert-error shadow-sm mb-6 text-xs font-semibold text-red-600 bg-red-50 border border-red-200 rounded-xl p-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-4 w-4 inline mr-1" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="{% url 'accounts:onboarding_user_form' %}"> {% csrf_token %}

        <div class="form-control w-full mb-4">
            <label class="label"><span class="label-text font-semibold text-gray-700">What Should we Call
                    You?</span></label>
            <input type="text" name="call_name" placeholder="e.g. Rishi Bhati" value="{{ prefill.call_name }}"
                class="input input-bordered w-full bg-white text-gray-900" required />
        </div>

        <div class="form-control w-full mb-4">
            <label class="label"><span class="label-text font-semibold text-gray-700">What's Your Tag?</span></label>
            <input type="text" name="tag" placeholder="rishi_dev" value="{{ prefill.tag }}"
                class="input input-bordered w-full bg-white text-gray-900" required />
        </div>

        <div class="form-control w-full mb-4">
            <label class="label"><span class="label-text font-semibold text-gray-700">Country?</span></label>
            <select name="country" class="select select-bordered w-full bg-white text-gray-900">
                {% include 'accounts/partials/country_options.html' %}
            </select>
        </div>

        <div class="form-control w-full mb-8">
            <label class="label"><span class="label-text font-semibold text-gray-700">Bio (Optional)</span></label>
            <textarea name="bio" class="textarea textarea-bordered h-24 bg-white text-gray-900"></textarea>
        </div>

        <div class="card-actions justify-center">
            <button type="submit"
                class="btn btn-primary btn-wide text-lg font-bold text-white shadow-lg hover:shadow-xl transition-all">LETS
                GOOO!!!</button>
        </div>
    </form>
</div>
