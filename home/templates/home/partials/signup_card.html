{% load custom_filters %}
<div class="card bg-white rounded-2xl shadow-xl border-0 w-full max-w-sm mx-auto">
    <div class="card-body p-8">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-900">Create Account</h2>
            <p class="text-sm text-gray-500 mt-1">Get started with Reportary</p>
        </div>

        {% if error %}
        <div role="alert" class="alert alert-error bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded-lg mb-4" id="error-alert">
            <div class="flex justify-between items-start">
                <div>
                    {% if error|is_list %}
                        <ul class="list-disc pl-5">
                        {% for e in error %}
                            <li>{{ e }}</li>
                        {% endfor %}
                        </ul>
                    {% else %}
                        <span>{{ error }}</span>
                    {% endif %}
                </div>
                <button class="text-red-700" onclick="document.getElementById('error-alert').style.display='none'">&times;</button>
            </div>
        </div>
        {% endif %}


        <form hx-post="{% url 'home:handle_signup' %}{% if next %}?next={{ next }}{% endif %}" hx-target="#auth-card-container" hx-swap="innerHTML" class="space-y-4">
            {% csrf_token %}

            <div class="form-control w-full">
                <label class="label">
                    <span class="label-text font-medium text-gray-700">Email</span>
                </label>
                <input type="email" name="email" placeholder="name@company.com"
                    class="input input-bordered w-full focus:border-[#226ce0] bg-gray-50 focus:bg-white transition-colors"
                    required />
            </div>

            <div class="form-control w-full">
                <label class="label">
                    <span class="label-text font-medium text-gray-700">Password</span>
                </label>
                <div style="position: relative; width: 100%; display: block;">
                    <input type="password" name="password" placeholder="Min. 8 characters"
                        class="input input-bordered w-full pr-10 focus:border-[#226ce0] bg-gray-50 focus:bg-white transition-colors"
                        required />
                    <button type="button" style="position: absolute; top: 0; bottom: 0; right: 0; height: 100%; display: flex; align-items: center; padding-left: 12px; padding-right: 12px; border: none; background: transparent; cursor: pointer; outline: none;" class="text-gray-400 hover:text-gray-600 password-toggle-btn" title="Hold to show password">
                        <svg class="h-5 w-5 eye-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg class="h-5 w-5 eye-slash-icon hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-control w-full">
                <label class="label">
                    <span class="label-text font-medium text-gray-700">Confirm Password</span>
                </label>
                <div style="position: relative; width: 100%; display: block;">
                    <input type="password" name="confirm_password" placeholder="••••••••"
                        class="input input-bordered w-full pr-10 focus:border-[#226ce0] bg-gray-50 focus:bg-white transition-colors"
                        required />
                    <button type="button" style="position: absolute; top: 0; bottom: 0; right: 0; height: 100%; display: flex; align-items: center; padding-left: 12px; padding-right: 12px; border: none; background: transparent; cursor: pointer; outline: none;" class="text-gray-400 hover:text-gray-600 password-toggle-btn" title="Hold to show password">
                        <svg class="h-5 w-5 eye-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg class="h-5 w-5 eye-slash-icon hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block text-white font-semibold mt-2 normal-case text-base">
                Sign Up
            </button>
        </form>

        <div class="divider text-xs text-gray-400 my-6">OR</div>

        <!-- Social Buttons Row -->
        <div style="position: relative; width: 100%;">
            <div class="grid grid-cols-4 gap-2 opacity-40 select-none pointer-events-none" style="filter: blur(0.5px);">
                <button type="button"
                    class="btn btn-sm btn-outline border-gray-300 hover:bg-gray-50 hover:text-gray-900 font-normal">Git</button>
                <button type="button"
                    class="btn btn-sm btn-outline border-gray-300 hover:bg-gray-50 hover:text-gray-900 font-normal">G</button>
                <button type="button"
                    class="btn btn-sm btn-outline border-gray-300 hover:bg-gray-50 hover:text-gray-900 font-normal">M</button>
                <button type="button"
                    class="btn btn-sm btn-outline border-gray-300 hover:bg-gray-50 hover:text-gray-900 font-normal">A</button>
            </div>
            <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(1px); -webkit-backdrop-filter: blur(1px); display: flex; align-items: center; justify-content: center; pointer-events: none; border-radius: 8px;">
                <span style="background: rgba(15, 23, 42, 0.95); color: #ffffff; font-size: 9px; font-weight: bold; letter-spacing: 0.05em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.15);">Coming Soon</span>
            </div>
        </div>

        <!-- Toggle to Login -->
        <div class="text-center mt-6 text-sm">
            <span class="text-gray-500">Already have an account? </span>
            <button
                class="text-[#226ce0] hover:text-[#1b56b3] font-medium no-underline hover:underline transition-colors"
                hx-get="{% url 'home:login_card' %}{% if next %}?next={{ next }}{% endif %}" hx-target="#auth-card-container" hx-swap="innerHTML">
                Sign In
            </button>
        </div>
    </div>
</div>
