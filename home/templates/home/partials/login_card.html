<div class="card bg-white rounded-2xl shadow-xl border-0 w-full max-w-sm mx-auto">
    <div class="card-body p-8">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-900">Sign In</h2>
            <p class="text-sm text-gray-500 mt-1">Welcome back to Reportary</p>
        </div>

        {% if error %}
        <div role="alert" class="alert alert-error bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded-lg mb-4 flex justify-between items-center" id="error-alert">
            <div class="flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <span>{{ error }}</span>
            </div>
            <button class="text-red-700" onclick="document.getElementById('error-alert').style.display='none'">&times;</button>
        </div>
        {% endif %}

        <form hx-post="{% url 'handle_login' %}" hx-target="#auth-card-container" hx-swap="innerHTML" class="space-y-4">
            {% csrf_token %}

            <div class="form-control w-full">
                <label class="label">
                    <span class="label-text font-medium text-gray-700">Email</span>
                </label>
                <input type="email" name="email" placeholder="name@company.com"
                    class="input input-bordered w-full focus:border-[#226ce0] bg-gray-50 focus:bg-white transition-colors"
                    required />
            </div>

            <div class="form-control w-full">
                <label class="label">
                    <span class="label-text font-medium text-gray-700">Password</span>
                </label>
                <input type="password" name="password" placeholder="••••••••"
                    class="input input-bordered w-full focus:border-[#226ce0] bg-gray-50 focus:bg-white transition-colors"
                    required />
                <label class="label">
                    <a href="{% url 'nota' %}" class="label-text-alt hover:underline text-[#226ce0]">Forgot
                        password?</a>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block text-white font-semibold mt-2 normal-case text-base">
                Sign In
            </button>
        </form>

        <div class="divider text-xs text-gray-400 my-6">OR</div>

        <!-- Social Buttons Row -->
        <div class="grid grid-cols-4 gap-2">
            <button type="button"
                class="btn btn-sm btn-outline border-gray-300 hover:bg-gray-50 hover:text-gray-900 font-normal">Git</button>
            <button type="button"
                class="btn btn-sm btn-outline border-gray-300 hover:bg-gray-50 hover:text-gray-900 font-normal">G</button>
            <button type="button"
                class="btn btn-sm btn-outline border-gray-300 hover:bg-gray-50 hover:text-gray-900 font-normal">M</button>
            <button type="button"
                class="btn btn-sm btn-outline border-gray-300 hover:bg-gray-50 hover:text-gray-900 font-normal">A</button>
        </div>

        <!-- Toggle to Signup -->
        <div class="text-center mt-6 text-sm">
            <span class="text-gray-500">New to Reportary? </span>
            <button
                class="text-[#226ce0] hover:text-[#1b56b3] font-medium no-underline hover:underline transition-colors"
                hx-get="{% url 'signup_card' %}" hx-target="#auth-card-container" hx-swap="innerHTML">
                Create account
            </button>
        </div>
    </div>
</div>
