{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Reportary{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#f8f9fc] text-gray-900 min-h-screen flex flex-col">

    <!-- Nav -->
    <nav class="bg-white border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="{% url 'home:landing_page' %}" class="flex items-center gap-2.5 group">
                <div class="w-8 h-8 rounded-lg bg-[#226ce0] text-white flex items-center justify-center font-bold text-sm shadow-md shadow-[#226ce0]/25 group-hover:scale-110 transition-transform">R</div>
                <span class="font-bold text-lg text-gray-900 group-hover:text-[#226ce0] transition-colors">Reportary</span>
            </a>
            <div class="flex items-center gap-6 text-sm text-gray-600">
                <a href="{% url 'home:faq' %}" class="hover:text-[#226ce0] transition-colors">FAQ</a>
                <a href="{% url 'home:contact' %}" class="hover:text-[#226ce0] transition-colors">Contact</a>
                <a href="{% url 'home:privacy' %}" class="hover:text-[#226ce0] transition-colors">Privacy</a>
                {% if user.is_authenticated %}
                <a href="{% url 'dashboard:dashboard' %}" class="px-4 py-2 bg-[#226ce0] text-white rounded-lg text-xs font-semibold hover:bg-[#1b56b3] transition-colors">Dashboard</a>
                {% else %}
                <a href="{% url 'home:landing_page' %}#auth-section" class="px-4 py-2 bg-[#226ce0] text-white rounded-lg text-xs font-semibold hover:bg-[#1b56b3] transition-colors">Get Started</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto w-full px-6 py-14">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-100 bg-white py-8">
        <div class="max-w-7xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-gray-400">
            <span>© 2026 Reportary. All rights reserved.</span>
            <div class="flex gap-5">
                <a href="{% url 'home:privacy' %}" class="hover:text-[#226ce0] transition-colors">Privacy Policy</a>
                <a href="{% url 'home:terms' %}" class="hover:text-[#226ce0] transition-colors">Terms of Service</a>
                <a href="{% url 'home:contact' %}" class="hover:text-[#226ce0] transition-colors">Contact</a>
            </div>
        </div>
    </footer>

</body>
</html>
